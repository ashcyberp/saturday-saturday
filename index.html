<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BF's Day 💗</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #3b1724;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 650px;
      width: 100%;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    button {
      border: none;
      background: #ff6f9f;
      color: white;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 30px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    .heart {
      font-size: 70px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <section class="page">
    <div class="container">

      <div class="heart">💗</div>

      <h1>
        HAPPY BF'S DAY<br>
        MY FAT BITCH 😭💗
      </h1>

      <p>
        congratulations on surviving another day of being my boyfriend.
      </p>

      <button>
        enter at your own risk 🤭
      </button>

    </div>
  </section>

</body>
</html>
